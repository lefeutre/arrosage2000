<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Arrosage 2000 Pro</title>
    <style>
        /* --- MOTEUR DE THÈMES --- */
        :root {
            --bg: #080c16; --surf: #151e32; --surf-alt: rgba(255, 255, 255, 0.05);
            --text: #f8fafc; --text-dim: #94a3b8; --prim: #0ea5e9; --prim-l: #38bdf8;
            --font: 'system-ui', sans-serif; --rad: 20px;
            --tank-border: 4px solid var(--text-dim); --tank-rad: 12px 12px 24px 24px;
            --water-bg: linear-gradient(180deg, var(--prim-l), var(--prim)); --foam: none;
        }

        body.theme-nature {
            --bg: #f0fdf4; --surf: #ffffff; --surf-alt: #f0fdf4;
            --text: #166534; --text-dim: #15803d; --prim: #22c55e; --prim-l: #4ade80;
            --font: 'Trebuchet MS', sans-serif; --rad: 30px;
            --tank-border: 4px solid #bbf7d0; --tank-rad: 30px;
            --water-bg: linear-gradient(180deg, #4ade80, #22c55e);
        }

        body.theme-noah {
            --bg: #1e140a; --surf: #2d1d11; --surf-alt: #3d2817;
            --text: #fef3c7; --text-dim: #d97706; --prim: #f59e0b; --prim-l: #fbbf24;
            --font: 'Georgia', serif; --rad: 10px;
            --tank-border: 6px solid rgba(255, 255, 255, 0.4); --tank-rad: 5px 5px 20px 20px;
            --water-bg: linear-gradient(to bottom, #fbbf24, #b45309); --foam: 10px solid #ffffff;
        }

        body.theme-tom {
            --bg: #111827; --surf: #1f2937; --surf-alt: #374151;
            --text: #f8fafc; --text-dim: #9ca3af; --prim: #fc4c02; --prim-l: #fdba74;
            --font: 'Impact', 'Arial Black', sans-serif; --rad: 8px;
            --tank-border: 3px solid #4b5563; --tank-rad: 25px 25px 15px 15px;
            --water-bg: linear-gradient(to bottom, #06b6d4, #0369a1);
        }

        /* --- STYLES GLOBAUX --- */
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: var(--font); -webkit-tap-highlight-color: transparent; }
        body { background-color: var(--bg); color: var(--text); padding-bottom: 110px; display: flex; justify-content: center; transition: background-color 0.4s ease, color 0.4s ease; }
        .app-container { width: 100%; max-width: 500px; min-height: 100vh; display: flex; flex-direction: column; }
        
        header { padding: 20px; display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid rgba(255,255,255,0.05); }
        .header-title { font-size: 1.4rem; font-weight: 800; color: var(--prim-l); transition: color 0.3s; }
        
        .view { display: none; padding: 15px; }
        .view.active { display: block; }
        
        .card { background: var(--surf); border-radius: var(--rad); padding: 20px; margin-bottom: 15px; border: 1px solid rgba(255,255,255,0.05); box-shadow: 0 8px 20px rgba(0,0,0,0.15); animation: fadeUp 0.4s cubic-bezier(0.2, 0.8, 0.2, 1) backwards; }
        
        @keyframes fadeUp { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; transform: translateY(0); } }

        h3 { font-size: 0.9rem; text-transform: uppercase; letter-spacing: 1px; margin-bottom: 15px; color: var(--text-dim); font-family: sans-serif; }

        #active-banner { display: none; background: var(--prim); color: var(--bg); padding: 12px; border-radius: var(--rad); margin-bottom: 15px; text-align: center; font-weight: 900; animation: blink 1.5s infinite; font-family: sans-serif; }
        @keyframes blink { 0%, 100% { opacity: 1; } 50% { opacity: 0.8; } }

        .weather-temp { font-size: 2.5rem; font-weight: 900; font-family: sans-serif; }
        .weather-icon { font-size: 3.5rem; filter: drop-shadow(0 4px 6px rgba(0,0,0,0.3)); animation: float 4s ease-in-out infinite; }
        @keyframes float { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-8px); } }
        
        .weather-details { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; background: var(--surf-alt); padding: 12px; border-radius: 15px; text-align: center; font-family: sans-serif; margin-top: 10px; }
        .w-det-item { font-size: 0.85rem; color: var(--text-dim); font-weight: bold; display: block; }
        .w-det-val { font-size: 1.1rem; color: var(--text); margin-top: 4px; display: block; }

        .tank-mini { width: 90px; height: 150px; border: var(--tank-border); border-radius: var(--tank-rad); margin: 15px auto; position: relative; overflow: hidden; background: rgba(0,0,0,0.2); box-shadow: inset 0 0 10px rgba(0,0,0,0.5); transition: border 0.3s, border-radius 0.3s; }
        .water-mini { position: absolute; bottom: 0; width: 100%; background: var(--water-bg); border-top: var(--foam); transition: height 1s cubic-bezier(0.4, 0, 0.2, 1), background 0.3s; }
        .tank-val { font-size: 2.5rem; font-weight: 900; text-align: center; margin-top: 10px; transition: color 0.3s; }

        .input-box { width: 100%; padding: 14px; border-radius: 12px; background: var(--surf-alt); border: 1px solid rgba(255,255,255,0.1); color: var(--text); margin-bottom: 12px; font-size: 1rem; outline: none; transition: background 0.3s, border 0.3s; }
        .input-box:focus { border-color: var(--prim); background: var(--surf); }
        
        .days-grid { display: grid; grid-template-columns: repeat(7, 1fr); gap: 5px; margin-bottom: 20px; }
        .day-check { display: none; }
        .day-label { height: 44px; display: flex; justify-content: center; align-items: center; border-radius: 10px; background: var(--surf-alt); color: var(--text-dim); font-weight: bold; font-size: 0.85rem; border: 1px solid transparent; cursor: pointer; transition: all 0.2s ease; font-family: sans-serif;}
        .day-check:checked + .day-label { background: var(--prim); color: var(--bg); border-color: var(--prim-l); transform: scale(0.95); }

        .switch { position: relative; width: 54px; height: 30px; }
        .switch input { opacity: 0; width: 0; height: 0; }
        .slider { position: absolute; cursor: pointer; top: 0; left: 0; right: 0; bottom: 0; background: #475569; border-radius: 30px; transition: .4s cubic-bezier(0.4, 0, 0.2, 1); }
        .slider:before { position: absolute; content: ""; height: 22px; width: 22px; left: 4px; bottom: 4px; background: white; border-radius: 50%; transition: .4s cubic-bezier(0.4, 0, 0.2, 1); }
        input:checked + .slider { background: var(--prim); }
        input:checked + .slider:before { transform: translateX(24px); }

        .btn { width: 100%; padding: 16px; background: var(--prim); color: var(--bg); border: none; border-radius: var(--rad); font-weight: 900; font-size: 1.1rem; cursor: pointer; transition: transform 0.1s, opacity 0.2s; }
        .btn:active { transform: scale(0.98); opacity: 0.9; }
        .btn-boost { flex: 1; background: var(--surf-alt); border: 1px solid rgba(255,255,255,0.1); color: var(--text); padding: 12px; border-radius: 12px; font-weight: bold; cursor: pointer; transition: background 0.2s, transform 0.1s; }
        .btn-boost:active { background: var(--prim); color: var(--bg); transform: scale(0.95); }

        .bottom-nav { position: fixed; bottom: 0; width: 100%; max-width: 500px; background: var(--surf); border-top: 1px solid rgba(255,255,255,0.05); display: flex; justify-content: space-around; padding: 12px 0 calc(12px + env(safe-area-inset-bottom)); backdrop-filter: blur(15px); transition: background 0.3s; z-index: 1000; }
        .nav-item { border: none; background: none; color: var(--text-dim); font-size: 0.7rem; font-weight: bold; display: flex; flex-direction: column; align-items: center; gap: 4px; cursor: pointer; font-family: sans-serif; transition: color 0.3s; }
        .nav-item.active { color: var(--prim); }
        .nav-item .icon { font-size: 1.4rem; transition: transform 0.3s cubic-bezier(0.2, 0.8, 0.2, 1); }
        
        #toast { position: fixed; bottom: 90px; left: 50%; transform: translate(-50%, 20px); background: var(--text); color: var(--bg); padding: 12px 24px; border-radius: 30px; font-weight: bold; opacity: 0; transition: 0.3s cubic-bezier(0.2, 0.8, 0.2, 1); pointer-events: none; z-index: 9999; font-family: sans-serif; white-space: nowrap; box-shadow: 0 4px 15px rgba(0,0,0,0.3); }
        #toast.show { opacity: 1; transform: translate(-50%, 0); }
        
        .list-item { display: flex; justify-content: space-between; align-items: center; padding: 14px; background: var(--surf-alt); border-radius: 12px; margin-top: 10px; border: 1px solid rgba(255,255,255,0.05); font-family: sans-serif; transition: background 0.3s; }
        .log-time { color: var(--text-dim); font-size: 0.8rem; }
    </style>
</head>
<body class="theme-cyber">

    <div class="app-container">
        <header>
            <div class="header-title" id="main-title">Arrosage 2000</div>
            <div id="badge" style="font-size: 0.85rem; font-weight: bold; font-family: sans-serif; transition: color 0.3s;">● Connexion...</div>
        </header>

        <div id="active-banner">ACTION EN COURS</div>

        <main id="view-home" class="view active">
            <div class="card" style="padding: 25px;">
                <div style="display: flex; justify-content: space-between; align-items: center;">
                    <div>
                        <div style="color: var(--text-dim); font-weight: bold; font-size: 0.9rem; font-family: sans-serif;" id="w-city-display">📍 Recherche...</div>
                        <div class="weather-temp" id="w-temp">--°</div>
                        <div style="font-weight: bold; font-size: 1rem; margin-top: 5px; font-family: sans-serif;" id="w-desc">Mise à jour...</div>
                    </div>
                    <div class="weather-icon" id="w-icon">⛅</div>
                </div>
                
                <div class="weather-details">
                    <div>
                        <span class="w-det-item">💧 Humidité</span>
                        <span class="w-det-val" id="w-hum">--%</span>
                    </div>
                    <div style="border-left: 1px solid rgba(255,255,255,0.1); border-right: 1px solid rgba(255,255,255,0.1);">
                        <span class="w-det-item">💨 Vent</span>
                        <span class="w-det-val" id="w-wind">-- km/h</span>
                    </div>
                    <div>
                        <span class="w-det-item">🌡️ Min/Max</span>
                        <span class="w-det-val" id="w-minmax">--° / --°</span>
                    </div>
                </div>
            </div>

            <div class="card">
                <h3 id="tank-label" style="text-align: center;">Réserve de Liquide</h3>
                <div class="tank-mini"><div id="water-level" class="water-mini"></div></div>
                <div class="tank-val" id="vol-txt">-- L</div>
                <div style="text-align: center; color: var(--text-dim); font-size: 0.8rem; font-family: sans-serif; margin-top: 5px;">Max : <span id="max-txt">5</span>L</div>
            </div>

            <div class="card">
                <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px; font-family: sans-serif;">
                    <b id="pump-label" style="font-size: 1.1rem;">Contrôle Manuel</b>
                    <label class="switch"><input type="checkbox" id="pump-toggle"><span class="slider"></span></label>
                </div>
                <div style="display: flex; gap: 10px;">
                    <button class="btn-boost" onclick="SmartEngine.boost(5)">⏱️ 5 min</button>
                    <button class="btn-boost" onclick="SmartEngine.boost(15)">⏱️ 15 min</button>
                    <button class="btn-boost" id="stop-btn" onclick="SmartEngine.stop()" style="color: #ef4444; display: none;">🛑 STOP</button>
                </div>
            </div>
        </main>

        <main id="view-plan" class="view">
            <div class="card">
                <h3>Ajouter un programme</h3>
                <div style="display: flex; gap: 10px;">
                    <input type="time" id="time-in" class="input-box">
                    <input type="number" id="dur-in" class="input-box" placeholder="Min" min="1">
                </div>
                <div class="days-grid">
                    <label><input type="checkbox" class="day-check" value="Lu"><div class="day-label">Lu</div></label>
                    <label><input type="checkbox" class="day-check" value="Ma"><div class="day-label">Ma</div></label>
                    <label><input type="checkbox" class="day-check" value="Me"><div class="day-label">Me</div></label>
                    <label><input type="checkbox" class="day-check" value="Je"><div class="day-label">Je</div></label>
                    <label><input type="checkbox" class="day-check" value="Ve"><div class="day-label">Ve</div></label>
                    <label><input type="checkbox" class="day-check" value="Sa"><div class="day-label">Sa</div></label>
                    <label><input type="checkbox" class="day-check" value="Di"><div class="day-label">Di</div></label>
                </div>
                <button class="btn" onclick="saveNewPlan()">Enregistrer</button>
            </div>
            <div id="plan-list"></div>
        </main>

        <main id="view-stats" class="view">
            <div class="card">
                <h3>Historique d'activité</h3>
                <div id="logs-container" style="max-height: 60vh; overflow-y: auto; padding-right: 5px;"></div>
                <button onclick="clearLogs()" style="width: 100%; padding: 12px; margin-top: 15px; background: var(--surf-alt); border: 1px solid rgba(255,255,255,0.1); color: var(--text-dim); border-radius: 12px; cursor: pointer; font-weight: bold;">Effacer l'historique</button>
            </div>
        </main>

        <main id="view-settings" class="view">
            <div class="card">
                <h3>Ambiances</h3>
                <select id="theme-select" class="input-box" onchange="previewTheme()">
                    <option value="theme-cyber">🔵 Cyber Night</option>
                    <option value="theme-nature">🌿 Nature Soft</option>
                    <option value="theme-noah">🍺 Thème Noah</option>
                    <option value="theme-tom">🏃 Thème Tom</option>
                </select>
            </div>
            <div class="card">
                <h3>⚙️ Paramètres Cuve</h3>
                <input type="number" id="max-in" class="input-box" placeholder="Capacité Cuve (L)" value="5">
            </div>
            <div class="card">
                <h3>🗑️ Entretien</h3>
                <button class="btn" style="background: #ef4444;" onclick="vidangerCuve()">Vidanger la cuve (Remise à 0)</button>
            </div>
            <button class="btn" onclick="saveSettings()">Appliquer les changements</button>
        </main>

        <nav class="bottom-nav">
            <button class="nav-item active" onclick="showView('view-home', this)"><span class="icon">🏠</span>Accueil</button>
            <button class="nav-item" onclick="showView('view-plan', this)"><span class="icon">📅</span>Planning</button>
            <button class="nav-item" onclick="showView('view-stats', this)"><span class="icon">📋</span>Journal</button>
            <button class="nav-item" onclick="showView('view-settings', this)"><span class="icon">⚙️</span>Réglages</button>
        </nav>
        
        <div id="toast">Message</div>
    </div>

    <script>
        const AppState = {
            volume: 0, 
            maxVolume: parseInt(localStorage.getItem('max_v')) || 5,
            location: { name: "Molsheim", lat: 48.54, lon: 7.49 },
            logs: JSON.parse(localStorage.getItem('sys_logs')) || []
        };

        function addLog(message) {
            const now = new Date();
            const timeStr = String(now.getHours()).padStart(2, '0') + ":" + String(now.getMinutes()).padStart(2, '0');
            AppState.logs.unshift({ msg: message, time: timeStr });
            if (AppState.logs.length > 40) AppState.logs.pop();
            localStorage.setItem('sys_logs', JSON.stringify(AppState.logs));
            renderLogs();
        }

        function renderLogs() {
            const cont = document.getElementById('logs-container');
            cont.innerHTML = AppState.logs.length ? "" : '<div style="text-align:center; padding:20px; color:var(--text-dim);">Aucun événement récent.</div>';
            AppState.logs.forEach(log => {
                cont.innerHTML += `<div class="list-item"><span>${log.msg}</span><span class="log-time">${log.time}</span></div>`;
            });
        }
        function clearLogs() { AppState.logs = []; localStorage.removeItem('sys_logs'); renderLogs(); }

        const SmartEngine = {
            async boost(mins) {
                if (AppState.volume <= 0.2) return showToast("Impossible : Réservoir vide !");
                // On envoie la durée à l'Arduino
                await sendPump(true, mins);
                showToast(`Chrono lancé : ${mins} min`);
                addLog(`▶️ Boost (${mins} min)`);
            },
            async stop() {
                await sendPump(false, 0);
                addLog("🛑 Arrêt manuel");
            }
        };

        async function fetchAll() {
            try {
                const res = await fetch('/.netlify/functions/get-status');
                const data = await res.json();
                
                AppState.volume = parseFloat(data.volume_eau);
                const pct = (AppState.volume / AppState.maxVolume) * 100;
                document.getElementById('water-level').style.height = Math.min(pct, 100) + "%";
                
                const txt = document.getElementById('vol-txt');
                txt.textContent = AppState.volume <= 0.2 ? "VIDE !" : AppState.volume.toFixed(1) + " L";
                if(AppState.volume <= 0.2) txt.style.color = "#ef4444"; else txt.style.color = "inherit";

                document.getElementById('pump-toggle').checked = data.pompe_etat;
                
                // Gestion bannière
                if (!data.pompe_etat) {
                    document.getElementById('active-banner').style.display = 'none';
                    document.getElementById('stop-btn').style.display = 'none';
                } else {
                    document.getElementById('active-banner').style.display = 'block';
                    document.getElementById('stop-btn').style.display = 'block';
                }

                document.getElementById('badge').style.color = "var(--prim-l)";
                document.getElementById('badge').textContent = "● Connecté";
            } catch(e) { 
                document.getElementById('badge').style.color = "#ef4444"; 
                document.getElementById('badge').textContent = "● Déconnecté"; 
            }
        }

        async function sendPump(state, dureeMins = 0) {
            await fetch('/.netlify/functions/update-pump', { 
                method: 'POST', 
                body: JSON.stringify({ pompe_etat: state, duree: dureeMins }) 
            });
        }

        document.getElementById('pump-toggle').onchange = (e) => {
            if (e.target.checked && AppState.volume <= 0.2) { e.target.checked = false; return showToast("Réservoir vide !"); }
            sendPump(e.target.checked, 0);
            addLog(e.target.checked ? "▶️ Allumage manuel" : "🛑 Extinction manuelle");
        };

        async function vidangerCuve() {
            if(!confirm("Remettre le volume à 0 Litre ?")) return;
            await fetch('/.netlify/functions/update-volume', { method: 'POST', body: JSON.stringify({ volume_eau: 0.0 }) });
            showToast("Cuve vidangée !");
        }

        function saveSettings() {
            const m = document.getElementById('max-in').value;
            if(m) { AppState.maxVolume = m; localStorage.setItem('max_v', m); document.getElementById('max-txt').textContent = m; }
            localStorage.setItem('arrosage_theme', document.getElementById('theme-select').value);
            document.body.className = document.getElementById('theme-select').value;
            showToast("Réglages sauvés");
        }

        function previewTheme() { document.body.className = document.getElementById('theme-select').value; }

        function showView(id, btn) {
            document.querySelectorAll('.view').forEach(v => v.classList.remove('active'));
            document.querySelectorAll('.nav-item').forEach(n => n.classList.remove('active'));
            document.getElementById(id).classList.add('active');
            btn.classList.add('active');
        }

        function showToast(m) { 
            const t = document.getElementById('toast'); t.textContent = m; 
            t.classList.add('show'); setTimeout(() => t.classList.remove('show'), 2500); 
        }

        window.onload = () => {
            const theme = localStorage.getItem('arrosage_theme') || 'theme-cyber';
            document.body.className = theme;
            document.getElementById('theme-select').value = theme;
            document.getElementById('max-txt').textContent = AppState.maxVolume;
            renderLogs();
            fetchAll();
            setInterval(fetchAll, 2000);
        };

        function updateThemeLabels(theme, isRunning) {
            const title = document.getElementById('main-title');
            if(theme === 'theme-noah') title.textContent = "Noah Tavern 🍺";
            else if(theme === 'theme-tom') title.textContent = "Tom Trail Pro 🏃";
            else title.textContent = "Arrosage 2000";
        }
    </script>
</body>
</html>
